# Firebase App Hosting config
runConfig:
  minInstances: 0
  maxInstances: 4
  timeoutSeconds: 120   # ask_user waits up to ~50s for an answer

env:
  # Storage bucket: the project's default bucket is used automatically.
  # To use another one, add FIREBASE_STORAGE_BUCKET here.
  - variable: BIZDECIDE_MCP_KEY
    secret: bizdecide-mcp-key        # firebase apphosting:secrets:set bizdecide-mcp-key
    availability: [RUNTIME]
  # The Claude engine runs the skill scripts with python3. The server logs "[startup] Python 3.x" when it
  # finds it; if it logs "not found", point PYTHON_BIN at the interpreter (or deploy the Docker image).
  # - variable: PYTHON_BIN
  #   value: /usr/bin/python3
  #   availability: [RUNTIME]
