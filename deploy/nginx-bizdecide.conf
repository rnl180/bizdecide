# /etc/nginx/sites-available/bizdecide  (then: certbot --nginx -d bizdecide.masarsoftware.com)
server {
    listen 80;
    server_name bizdecide.masarsoftware.com;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3170;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # MCP streams responses and long-polls (wait_for_request / ask_user up to ~55s)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
